<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="hfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070714"/>
      <stop offset="50%" stop-color="#140a2b"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#hfBg)"/>

  <!-- Decorative Matrix / Code Particles -->
  <g opacity="0.15" stroke="#00f2fe" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Central Emblem Frame -->
  <rect x="250" y="110" width="700" height="455" rx="28" fill="#13112c" stroke="url(#neonOrange)" stroke-width="4" filter="url(#glow)"/>

  <!-- Open Source / Git Tree Branch Graphic -->
  <g transform="translate(600, 220)" text-anchor="middle">
    <!-- Stylized Pumpkin / Octocat / Git Pull Request nodes -->
    <circle cx="-90" cy="-20" r="14" fill="#00f2fe"/>
    <circle cx="0" cy="-20" r="16" fill="#ff5500"/>
    <circle cx="90" cy="-20" r="14" fill="#ffaa00"/>
    <path d="M-90 -20 Q0 25 90 -20" stroke="#ff0055" stroke-width="5" fill="none"/>
    <line x1="0" y1="-20" x2="0" y2="25" stroke="#00f2fe" stroke-width="5"/>
    <circle cx="0" cy="25" r="12" fill="#fff"/>
  </g>

  <!-- Typography -->
  <text x="600" y="340" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    HACKTOBERFEST
  </text>
  
  <text x="600" y="395" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="url(#neonOrange)" text-anchor="middle" letter-spacing="8">
    OPEN SOURCE CONTRIBUTOR
  </text>

  <rect x="420" y="430" width="360" height="50" rx="25" fill="#201c44" stroke="#4facfe" stroke-width="2"/>
  <text x="600" y="462" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#00f2fe" text-anchor="middle">
    DigitalOcean &amp; GitHub Global Event
  </text>
</svg>
